<text x="20" y="24" class="t">Steps to commit — prng</text><text x="20" y="44" class="s">40 samples (rows) × canvas positions (columns); cells appear in the order the model committed them</text><text x="20" y="66" class="s">no cells to draw — no position kept its final token from an accepted step onward (the model never stabilised)</text>
