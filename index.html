<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babble-on</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main>
      <header>
        <span id="label">connecting…</span>
        <span id="status"></span>
        <span id="rate"></span>
        <select id="source">
          <option value="auto">auto-detect</option>
          <option value="simulate">simulate</option>
          <option value="bad">bad rng</option>
        </select>
        <button id="pause">pause</button>
        <button id="reset">reset</button>
        <button id="record" title="write the raw stream to a .bbrec recording for the experiment harness">● record</button>
      </header>
      <section class="toprow">
        <div class="panel"><h2>Coherence</h2><canvas id="coherence"></canvas></div>
        <div class="panel"><h2>Randomness</h2><ul id="metrics"></ul></div>
        <div class="panel log"><h2>Anomaly log · band excursions</h2>
          <div class="bank" title="entropy harvested while the walk is out-of-band; spent to seed generations">
            <div class="bank-meter"><div id="bank-fill"></div></div>
            <span id="bank-label">bank —</span>
          </div>
          <div id="anomalies"></div></div>
      </section>
      <section class="panel gen">
        <h2>Diffusion · text crystallizing from hardware entropy</h2>
        <div class="gen-controls">
          <input id="prompt" type="text"
                 placeholder="prompt (inpainted as a locked prefix) — leave blank for pure entropy babble" />
          <select id="gen-mode">
            <option value="fast">fast · 48 steps</option>
            <option value="balanced" selected>balanced · 192 steps</option>
            <option value="quality">quality · 384 steps</option>
            <option value="ultra">ultra · 768 steps</option>
          </select>
          <button id="gen-btn">Generate</button>
          <button id="export-seed" title="spend the anomaly bank into a seed bundle (97 KiB, one DiffusionGemma canvas) for the harness">export seed</button>
          <span id="gen-status">idle</span>
        </div>
        <div class="gen-params">
          <label>temp <input id="gen-temp" type="range" min="0.5" max="1.4" step="0.05" value="0.9" />
            <span id="gen-temp-val">0.90</span></label>
          <label>noise <input id="gen-noise" type="range" min="0.7" max="1.3" step="0.05" value="1.0" />
            <span id="gen-noise-val">1.00</span></label>
          <label class="check"><input id="gen-ddim" type="checkbox" /> DDIM · deterministic (z₁ alone)</label>
        </div>
        <div id="gen-seed" class="gen-seed"></div>
        <div id="gen-output" class="gen-output"></div>
      </section>
      <section class="botrow">
        <div class="panel"><h2>Byte distribution</h2><canvas id="histogram"></canvas></div>
        <div class="panel"><h2>Bitstream</h2><canvas id="bitstream"></canvas></div>
      </section>
    </main>
  </body>
</html>
