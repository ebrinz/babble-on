name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (bbrec + app, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bbrec
            src-tauri
      - name: bbrec
        run: cargo test --manifest-path bbrec/Cargo.toml
      - name: app (candle on CPU; the stub-sidecar round trip skips without the harness venv)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  harness:
    name: harness (pytest, CPU torch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: venv
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          uv pip install --python .venv/bin/python "transformers>=5.18"
      - name: pytest
        env:
          BABBLE_EXPERIMENT_LOG: "0"
        run: .venv/bin/python -m pytest -q

  frontend:
    name: frontend (vitest, build, headless UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Chromium for the headless UI test
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
